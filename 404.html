<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <meta name="theme-color" content="#0b0f17">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f17; color: #e6eaf2; font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
    h1 { font-size: 72px; margin: 0; background: linear-gradient(90deg, #6ea8fe, #3ddc97); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: #9aa5bd; }
    a { display: inline-block; margin-top: 12px; padding: 8px 16px; border-radius: 8px; background: #6ea8fe; color: #08111f; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page doesn't exist.</p>
    <!-- GitHub Pages serves this file for any missing path, so the link is computed relative to the site root. -->
    <a id="home" href="/">Go home</a>
  </main>
  <script>
    // Project sites live at /<repo>/, so link to the first path segment when on github.io
    if (location.hostname.endsWith("github.io")) {
      const seg = location.pathname.split("/").filter(Boolean)[0];
      document.getElementById("home").href = seg ? "/" + seg + "/" : "/";
    }
  </script>
</body>
</html>
